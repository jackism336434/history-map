<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg-mohenjo-seal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c0a09"/>
      <stop offset="50%" stop-color="#1a1510"/>
      <stop offset="100%" stop-color="#12100e"/>
    </linearGradient>
    <linearGradient id="accent-mohenjo-seal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9C8B70" stop-opacity="0"/>
      <stop offset="50%" stop-color="#9C8B70" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#9C8B70" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow-mohenjo-seal">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#bg-mohenjo-seal)"/>
  
  <rect x="0" y="140" width="400" height="1" fill="url(#accent-mohenjo-seal)" opacity="0.4"/>
  <rect x="30" y="30" width="340" height="240" rx="2" fill="none" stroke="#2a2520" stroke-width="0.5" opacity="0.6"/>
  
  <g transform="translate(170, 70)" opacity="0.3">
